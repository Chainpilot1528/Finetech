openapi: 3.1.0
info:
  title: Vittora API
  version: 0.1.0
  description: >
    Contract for the Vittora API. x-access says who may call each operation:
    "public" (anyone), "session" (signed in, two-step finished), "mfa-incomplete" (signed in,
    two-step may be unfinished) or a capability such as "users.manage".
servers:
  - url: /api/v1
components:
  schemas:
    Problem:
      type: object
      required: [status, code, title]
      properties:
        status: { type: integer }
        code: { type: string }
        title: { type: string }
    MfaState:
      type: string
      enum: [pending, enroll, ok]
    Credentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    Code:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: '^[0-9]{6}$' }
    User:
      type: object
      required: [id, name, email, role, status, mfaEnabled]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        phone: { type: [string, 'null'] }
        role: { type: string }
        status: { type: string }
        mfaEnabled: { type: boolean }
        lastLoginAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    Partner:
      type: object
      required: [id, refCode, channelName, legalName, status, kycStatus]
      properties:
        id: { type: string, format: uuid }
        refCode: { type: string }
        channelName: { type: string }
        legalName: { type: string }
        status: { type: string }
        kycStatus: { type: string }
    Me:
      type: object
      required: [userId, role, mfaState, mfaEnabled, permissions, features]
      properties:
        userId: { type: string, format: uuid }
        role: { type: string }
        mfaState: { $ref: '#/components/schemas/MfaState' }
        mfaEnabled: { type: boolean }
        partner:
          oneOf:
            - $ref: '#/components/schemas/Partner'
            - type: 'null'
        features: { type: object, additionalProperties: true }
        permissions: { type: array, items: { type: string } }
    Accepted:
      type: object
      properties: { accepted: { type: boolean } }
    KycDocument:
      type: object
      required: [id, type, fileName, status]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        fileName: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        reviewerNote: { type: [string, 'null'] }
    Kyc:
      type: object
      required: [status, agreementAccepted, documents, required]
      properties:
        status: { type: string }
        agreementAccepted: { type: boolean }
        documents: { type: array, items: { $ref: '#/components/schemas/KycDocument' } }
        required: { type: array, items: { type: string } }
    OpsPartner:
      type: object
      required: [id, refCode, legalName, channelName, city, status, kycStatus]
      properties:
        id: { type: string, format: uuid }
        refCode: { type: string }
        legalName: { type: string }
        channelName: { type: string }
        city: { type: string }
        status: { type: string }
        kycStatus: { type: string }
    OpsPartnerDetail:
      allOf:
        - $ref: '#/components/schemas/OpsPartner'
        - type: object
          required: [documents, required]
          properties:
            documents: { type: array, items: { $ref: '#/components/schemas/KycDocument' } }
            required: { type: array, items: { type: string } }
    Link:
      type: object
      required: [url]
      properties: { url: { type: string } }
    Draft:
      type: object
      required: [id, version, status, data, documents, requiredDocuments, consent]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        status: { type: string }
        data: { type: object, additionalProperties: true }
        documents:
          type: array
          items:
            type: object
            required: [docType, fileName]
            properties: { docType: { type: string }, fileName: { type: string } }
        requiredDocuments:
          type: array
          items:
            type: object
            required: [code, label, required]
            properties: { code: { type: string }, label: { type: string }, required: { type: boolean } }
        consent: { type: string, enum: [none, sent, given] }
    CaseRef:
      type: object
      required: [id, caseNo, status]
      properties:
        id: { type: string, format: uuid }
        caseNo: { type: string }
        status: { type: string }
    Pagination:
      type: object
      required: [page, limit, totalItems, totalPages]
      properties:
        page: { type: integer }
        limit: { type: integer }
        totalItems: { type: integer }
        totalPages: { type: integer }
    CaseSummary:
      type: object
      required: [id, caseNo, caseType, product, productName, loanType, status, loanAmountPaise, lender, loggedBy, applicant, phone, createdAt, updatedAt, ageHours]
      properties:
        id: { type: string }
        caseNo: { type: string }
        caseType: { type: string }
        product: { type: string }
        productName: { type: string }
        loanType: { type: string }
        status: { type: string }
        loanAmountPaise: { type: number }
        lender: { type: string }
        loggedBy: { type: string }
        applicant: { type: string }
        phone: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
        ageHours: { type: integer }
    HistoryEntry:
      type: object
      required: [id, toStatus, actor, at]
      properties:
        id: { type: string }
        fromStatus: { type: [string, 'null'] }
        toStatus: { type: string }
        actor: { type: string }
        reasonCode: { type: [string, 'null'] }
        note: { type: [string, 'null'] }
        at: { type: string }
    CaseNote:
      type: object
      required: [id, author, at, body]
      properties: { id: { type: string }, author: { type: string }, at: { type: string }, body: { type: string } }
    CaseFile:
      type: object
      required: [id, docType, fileName, at]
      properties: { id: { type: string }, docType: { type: string }, fileName: { type: string }, at: { type: string } }
    Disbursal:
      type: object
      required: [id, trancheNo, utr, amountPaise, disbursedOn, isFinal]
      properties:
        id: { type: string }
        trancheNo: { type: integer }
        utr: { type: string }
        amountPaise: { type: number }
        disbursedOn: { type: string }
        isFinal: { type: boolean }
    CaseDetail:
      type: object
      required: [id, caseNo, caseType, status, version, product, productName, loanType, lender, loanAmountPaise, tenureMonths, loggedBy, createdAt, updatedAt, details, applicant, history, notes, documents, disbursals, allowedTransitions, canUpload]
      properties:
        id: { type: string }
        caseNo: { type: string }
        caseType: { type: string }
        status: { type: string }
        version: { type: integer }
        product: { type: string }
        productName: { type: string }
        loanType: { type: string }
        lender: { type: string }
        loanAmountPaise: { type: number }
        tenureMonths: { type: integer }
        purpose: { type: [string, 'null'] }
        sanctionedAmountPaise: { type: [number, 'null'] }
        sanctionedRoiBps: { type: [integer, 'null'] }
        sanctionedTenureMonths: { type: [integer, 'null'] }
        loggedBy: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
        details: { type: object, additionalProperties: true }
        applicant:
          type: object
          required: [name, city, state, phone, masked]
          properties:
            name: { type: string }
            city: { type: string }
            state: { type: string }
            phone: { type: string }
            email: { type: [string, 'null'] }
            masked: { type: boolean }
        history: { type: array, items: { $ref: '#/components/schemas/HistoryEntry' } }
        notes: { type: array, items: { $ref: '#/components/schemas/CaseNote' } }
        documents: { type: array, items: { $ref: '#/components/schemas/CaseFile' } }
        disbursals: { type: array, items: { $ref: '#/components/schemas/Disbursal' } }
        allowedTransitions: { type: array, items: { type: string } }
        canUpload: { type: boolean }
    Dashboard:
      type: object
      required: [month, view, registered, stages, needsAction, approval, revenue, recent, totalCases]
      properties:
        month: { type: string }
        view: { type: string }
        registered: { type: integer }
        stages:
          type: array
          items: { type: object, required: [key, count], properties: { key: { type: string }, count: { type: integer } } }
        needsAction: { type: integer }
        approval:
          type: object
          required: [approved, decided]
          properties: { approved: { type: integer }, decided: { type: integer }, ratePct: { type: [integer, 'null'] } }
        revenue:
          type: object
          required: [cases, amountPaise, byProduct]
          properties:
            cases: { type: integer }
            amountPaise: { type: number }
            byProduct:
              type: array
              items:
                type: object
                required: [product, productName, cases, amountPaise]
                properties: { product: { type: string }, productName: { type: string }, cases: { type: integer }, amountPaise: { type: number } }
        commission:
          type: [object, 'null']
          properties: { pending: { type: number }, inReview: { type: number }, paid: { type: number } }
        recent: { type: array, items: { $ref: '#/components/schemas/CaseSummary' } }
        totalCases: { type: integer }
    Notification:
      type: object
      required: [id, type, payload, createdAt]
      properties:
        id: { type: string }
        type: { type: string }
        payload:
          type: object
          required: [caseId, caseNo, status]
          properties: { caseId: { type: string }, caseNo: { type: string }, status: { type: string } }
        readAt: { type: [string, 'null'] }
        createdAt: { type: string }
    NotificationPrefs:
      type: object
      required: [prefs]
      properties:
        prefs:
          type: object
          additionalProperties:
            type: object
            required: [email, inApp]
            properties: { email: { type: boolean }, inApp: { type: boolean } }
    OpsCaseRow:
      type: object
      required: [id, caseNo, product, productName, status, loanAmountPaise, possibleDuplicate, partner, ageHours]
      properties:
        id: { type: string }
        caseNo: { type: string }
        product: { type: string }
        productName: { type: string }
        status: { type: string }
        loanAmountPaise: { type: number }
        possibleDuplicate: { type: boolean }
        partner: { type: string }
        assignee: { type: [string, 'null'] }
        ageHours: { type: integer }
    OpsCaseDetail:
      type: object
      required: [id, caseNo, status, version, partner, product, productName, loanType, loanAmountPaise, tenureMonths, possibleDuplicate, lenderId, lenders, location, details, history, documents, disbursals, notes, allowedTransitions]
      properties:
        id: { type: string }
        caseNo: { type: string }
        status: { type: string }
        version: { type: integer }
        partner: { type: string }
        product: { type: string }
        productName: { type: string }
        loanType: { type: string }
        assignee: { type: [string, 'null'] }
        loanAmountPaise: { type: number }
        tenureMonths: { type: integer }
        possibleDuplicate: { type: boolean }
        lenderId: { type: string }
        lenders:
          type: array
          items: { type: object, required: [id, name], properties: { id: { type: string }, name: { type: string } } }
        sanctionedAmountPaise: { type: [number, 'null'] }
        location:
          type: object
          required: [city, state, pincode]
          properties: { city: { type: string }, state: { type: string }, pincode: { type: string } }
        details: { type: object, additionalProperties: true }
        history: { type: array, items: { $ref: '#/components/schemas/HistoryEntry' } }
        documents: { type: array, items: { $ref: '#/components/schemas/CaseFile' } }
        disbursals: { type: array, items: { $ref: '#/components/schemas/Disbursal' } }
        notes: { type: array, items: { $ref: '#/components/schemas/CaseNote' } }
        reversal:
          type: [object, 'null']
          properties: { id: { type: string }, reasonCode: { type: string }, reference: { type: string }, note: { type: [string, 'null'] }, status: { type: string } }
        allowedTransitions: { type: array, items: { type: string } }
    Invoice:
      type: object
      required: [id, status, caseId, caseNo, disbursalPaise, grossPaise, gstPaise, tdsPaise, netPaise, recoveredPaise, version, createdAt, applicant]
      properties:
        id: { type: string }
        invoiceNo: { type: [string, 'null'] }
        status: { type: string }
        caseId: { type: string }
        caseNo: { type: string }
        disbursalPaise: { type: number }
        grossPaise: { type: number }
        gstPaise: { type: number }
        tdsPaise: { type: number }
        netPaise: { type: number }
        recoveredPaise: { type: number }
        version: { type: integer }
        createdAt: { type: string }
        raisedAt: { type: [string, 'null'] }
        paidAt: { type: [string, 'null'] }
        payoutRef: { type: [string, 'null'] }
        applicant: { type: string }
    InvoiceDetail:
      allOf:
        - $ref: '#/components/schemas/Invoice'
        - type: object
          required: [events, legalName, canRaise]
          properties:
            rate: { type: [object, 'null'], additionalProperties: true }
            billing: { type: [object, 'null'], additionalProperties: true }
            legalName: { type: string }
            canRaise: { type: boolean }
            events: { type: array, items: { $ref: '#/components/schemas/HistoryEntry' } }
    OpsInvoice:
      type: object
      required: [id, status, caseNo, partner, version, grossPaise, netPaise]
      properties:
        id: { type: string }
        invoiceNo: { type: [string, 'null'] }
        status: { type: string }
        caseNo: { type: string }
        partner: { type: string }
        version: { type: integer }
        grossPaise: { type: number }
        netPaise: { type: number }
        payoutRef: { type: [string, 'null'] }
        payoutRequestedBy: { type: [string, 'null'] }
    RateCard:
      type: object
      required: [id, lender, product, slabMinPaise, pctBps, clawbackMonths, validFrom, status, createdBy]
      properties:
        id: { type: string }
        lender: { type: string }
        product: { type: string }
        loanType: { type: [string, 'null'] }
        slabMinPaise: { type: number }
        slabMaxPaise: { type: [number, 'null'] }
        pctBps: { type: integer }
        clawbackMonths: { type: integer }
        validFrom: { type: string }
        validTo: { type: [string, 'null'] }
        status: { type: string }
        createdBy: { type: string }
    Clawback:
      type: object
      required: [id, partner, amountPaise, recoveredPaise, reason, status, raisedBy]
      properties:
        id: { type: string }
        partner: { type: string }
        invoiceNo: { type: [string, 'null'] }
        amountPaise: { type: number }
        recoveredPaise: { type: number }
        reason: { type: string }
        status: { type: string }
        raisedBy: { type: string }
    Billing:
      type: object
      required: [gstRegistered, sacCode, panLast4, bankLast4, ifsc, bankName, branch, verificationStatus]
      properties:
        gstRegistered: { type: boolean }
        gstin: { type: [string, 'null'] }
        sacCode: { type: string }
        panLast4: { type: string }
        bankLast4: { type: string }
        ifsc: { type: string }
        bankName: { type: string }
        branch: { type: string }
        verificationStatus: { type: string }
        reviewerNote: { type: [string, 'null'] }
    Company:
      type: object
      required: [refCode, channelName, legalName, city, pincode, status, kycStatus, maskCustomerContact, registeredAt, products, admins]
      properties:
        refCode: { type: string }
        channelName: { type: string }
        legalName: { type: string }
        city: { type: string }
        pincode: { type: string }
        employeeBand: { type: [string, 'null'] }
        businessEmail: { type: [string, 'null'] }
        businessPhone: { type: [string, 'null'] }
        status: { type: string }
        kycStatus: { type: string }
        maskCustomerContact: { type: boolean }
        registeredAt: { type: string }
        lastLoginAt: { type: [string, 'null'] }
        products:
          type: array
          items: { type: object, required: [code, name], properties: { code: { type: string }, name: { type: string } } }
        admins:
          type: array
          items:
            type: object
            required: [name, email]
            properties: { name: { type: string }, email: { type: string }, phone: { type: [string, 'null'] } }
        billing:
          oneOf:
            - $ref: '#/components/schemas/Billing'
            - type: 'null'
    OpsBilling:
      type: object
      required: [gstRegistered, sacCode, pan, bankAccount, ifsc, bankName, branch, verificationStatus]
      properties:
        gstRegistered: { type: boolean }
        gstin: { type: [string, 'null'] }
        sacCode: { type: string }
        pan: { type: string }
        bankAccount: { type: string }
        ifsc: { type: string }
        bankName: { type: string }
        branch: { type: string }
        verificationStatus: { type: string }
        reviewerNote: { type: [string, 'null'] }
  responses:
    Error:
      description: Problem
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
paths:
  /auth/csrf:
    get:
      operationId: getCsrf
      x-access: public
      responses:
        '200':
          description: CSRF token, also set as a cookie
          content:
            application/json:
              schema:
                type: object
                required: [csrfToken]
                properties: { csrfToken: { type: string } }
  /auth/login:
    post:
      operationId: login
      x-access: public
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200':
          description: Signed in; two-step may still be needed
          content:
            application/json:
              schema:
                type: object
                required: [mfaState]
                properties: { mfaState: { $ref: '#/components/schemas/MfaState' } }
        default: { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      operationId: logout
      x-access: mfa-incomplete
      responses:
        '204': { description: Signed out }
        default: { $ref: '#/components/responses/Error' }
  /auth/sessions/revoke-all:
    post:
      operationId: revokeAllSessions
      x-access: session
      responses:
        '204': { description: All sessions ended }
        default: { $ref: '#/components/responses/Error' }
  /auth/password/forgot:
    post:
      operationId: forgotPassword
      x-access: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties: { email: { type: string, format: email } }
      responses:
        '202':
          description: Accepted, whether or not the account exists
          content:
            application/json:
              schema:
                type: object
                properties: { accepted: { type: boolean } }
        default: { $ref: '#/components/responses/Error' }
  /auth/password/reset:
    post:
      operationId: resetPassword
      x-access: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string }
      responses:
        '204': { description: Password set }
        default: { $ref: '#/components/responses/Error' }
  /auth/password/change:
    post:
      operationId: changePassword
      x-access: session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string }
      responses:
        '204': { description: Password changed }
        default: { $ref: '#/components/responses/Error' }
  /auth/mfa/setup:
    post:
      operationId: startMfaSetup
      x-access: mfa-incomplete
      responses:
        '200':
          description: Secret to add to an authenticator app
          content:
            application/json:
              schema:
                type: object
                required: [secret, otpauthUrl, qrDataUrl]
                properties:
                  secret: { type: string }
                  otpauthUrl: { type: string }
                  qrDataUrl: { type: string }
        default: { $ref: '#/components/responses/Error' }
  /auth/mfa/enable:
    post:
      operationId: enableMfa
      x-access: mfa-incomplete
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Code' }
      responses:
        '204': { description: Two-step sign-in is on }
        default: { $ref: '#/components/responses/Error' }
  /auth/mfa/verify:
    post:
      operationId: verifyMfa
      x-access: mfa-incomplete
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Code' }
      responses:
        '204': { description: Two-step finished }
        default: { $ref: '#/components/responses/Error' }
  /auth/mfa/email-otp:
    post:
      operationId: sendEmailOtp
      x-access: mfa-incomplete
      responses:
        '202':
          description: Code emailed
          content:
            application/json:
              schema:
                type: object
                properties: { accepted: { type: boolean } }
        default: { $ref: '#/components/responses/Error' }
  /me:
    get:
      operationId: getMe
      x-access: mfa-incomplete
      responses:
        '200':
          description: The signed-in user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        default: { $ref: '#/components/responses/Error' }
  /users:
    get:
      operationId: listUsers
      x-access: users.manage
      responses:
        '200':
          description: Users in the caller's organisation
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
        default: { $ref: '#/components/responses/Error' }
  /users/{id}:
    get:
      operationId: getUser
      x-access: users.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: One user in the caller's organisation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateUser
      x-access: users.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        default: { $ref: '#/components/responses/Error' }
  /ops/auth/login:
    post:
      operationId: opsLogin
      x-access: public
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200':
          description: Signed in; two-step is always needed
          content:
            application/json:
              schema:
                type: object
                required: [mfaState]
                properties: { mfaState: { $ref: '#/components/schemas/MfaState' } }
        default: { $ref: '#/components/responses/Error' }
  /partners/register:
    post:
      operationId: registerPartner
      x-access: public
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '202':
          description: Accepted, whether or not the email is taken
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Accepted' }
        default: { $ref: '#/components/responses/Error' }
  /partner/agreement:
    get:
      operationId: getAgreement
      x-access: kyc.manage
      responses:
        '200':
          description: Current partner agreement
