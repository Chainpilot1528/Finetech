openapi: 3.1.0
info:
  title: Vittora API
  version: 0.1.0
  description: >
    Contract for the Vittora API. x-access says who may call each operation:
    "public" (anyone), "session" (signed in, two-step finished), "mfa-incomplete" (signed in,
    two-step may be unfinished) or a capability such as "users.manage".
servers:
  - url: /api/v1
components:
  schemas:
    Problem:
      type: object
      required: [status, code, title]
      properties:
        status: { type: integer }
        code: { type: string }
        title: { type: string }
    MfaState:
      type: string
      enum: [pending, enroll, ok]
    Credentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    Code:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: '^[0-9]{6}$' }
    User:
      type: object
      required: [id, name, email, role, status, mfaEnabled]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        phone: { type: [string, 'null'] }
        role: { type: string }
        status: { type: string }
        mfaEnabled: { type: boolean }
        lastLoginAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    Partner:
      type: object
      required: [id, refCode, channelName, legalName, status, kycStatus]
      properties:
        id: { type: string, format: uuid }
        refCode: { type: string }
        channelName: { type: string }
        legalName: { type: string }
        status: { type: string }
        kycStatus: { type: string }
    Me:
      type: object
      required: [userId, role, mfaState, mfaEnabled, permissions, features]
      properties:
        userId: { type: string, format: uuid }
        role: { type: string }
        mfaState: { $ref: '#/components/schemas/MfaState' }
        mfaEnabled: { type: boolean }
        partner:
          oneOf:
            - $ref: '#/components/schemas/Partner'
            - type: 'null'
        features: { type: object, additionalProperties: true }
        permissions: { type: array, items: { type: string } }
    Accepted:
      type: object
      properties: { accepted: { type: boolean } }
    KycDocument:
      type: object
      required: [id, type, fileName, status]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        fileName: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        reviewerNote: { type: [string, 'null'] }
    Kyc:
      type: object
      required: [status, agreementAccepted, documents, required]
      properties:
        status: { type: string }
        agreementAccepted: { type: boolean }
        documents: { type: array, items: { $ref: '#/components/schemas/KycDocument' } }
        required: { type: array, items: { type: string } }
    OpsPartner:
      type: object
      required: [id, refCode, legalName, channelName, city, status, kycStatus]
      properties:
        id: { type: string, format: uuid }
        refCode: { type: string }
        legalName: { type: string }
        channelName: { type: string }
        city: { type: string }
        status: { type: string }
        kycStatus: { type: string }
    OpsPartnerDetail:
      allOf:
        - $ref: '#/components/schemas/OpsPartner'
        - type: object
          required: [documents, required]
          properties:
            documents: { type: array, items: { $ref: '#/components/schemas/KycDocument' } }
            required: { type: array, items: { type: string } }
    Link:
      type: object
      required: [url]
      properties: { url: { type: string } }
    Draft:
      type: object
      required: [id, version, status, data, documents, requiredDocuments, consent]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer }
        status: { type: string }
        data: { type: object, additionalProperties: true }
        documents:
          type: array
          items:
            type: object
            required: [docType, fileName]
            properties: { docType: { type: string }, fileName: { type: string } }
        requiredDocuments:
          type: array
          items:
            type: object
            required: [code, label, required]
            properties: { code: { type: string }, label: { type: string }, required: { type: boolean } }
        consent: { type: string, enum: [none, sent, given] }
    CaseRef:
      type: object
      required: [id, caseNo, status]
      properties:
        id: { type: string, format: uuid }
        caseNo: { type: string }
        status: { type: string }
  responses:
    Error:
      description: Problem
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
paths:
  /auth/csrf:
    get:
      operationId: getCsrf
      x-access: public
      responses:
        '200':
          description: CSRF token, also set as a cookie
          content:
            application/json:
              schema:
                type: object
                required: [csrfToken]
                properties: { csrfToken: { type: string } }
  /auth/login:
    post:
      operationId: login
      x-access: public
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200':
          description: Signed in; two-step may still be needed
          content:
            application/json:
              schema:
                type: object
                required: [mfaState]
                properties: { mfaState: { $ref: '#/components/schemas/MfaState' } }
        default: { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      operationId: logout
      x-access: mfa-incomplete
      responses:
        '204': { description: Signed out }
        default: { $ref: '#/components/responses/Error' }
  /auth/sessions/revoke-all:
    post:
      operationId: revokeAllSessions
      x-access: session
      responses:
        '204': { description: All sessions ended }
        default: { $ref: '#/components/responses/Error' }
  /auth/password/forgot:
    post:
      operationId: forgotPassword
      x-access: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties: { email: { type: string, format: email } }
      responses:
        '202':
          description: Accepted, whether or not the account exists
          content:
            application/json:
              schema:
                type: object
                properties: { accepted: { type: boolean } }
        default: { $ref: '#/components/responses/Error' }
  /auth/password/reset:
    post:
      operationId: resetPassword
      x-access: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string }
      responses:
        '204': { description: Password set }
        default: { $ref: '#/components/responses/Error' }
  /auth/password/change:
    post:
      operationId: changePassword
      x-access: session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string }
      responses:
        '204': { description: Password changed }
        default: { $ref: '#/components/responses/Error' }
  /auth/mfa/setup:
    post:
      operationId: startMfaSetup
      x-access: mfa-incomplete
      responses:
        '200':
          description: Secret to add to an authenticator app
          content:
            application/json:
              schema:
                type: object
                required: [secret, otpauthUrl, qrDataUrl]
                properties:
                  secret: { type: string }
                  otpauthUrl: { type: string }
                  qrDataUrl: { type: string }
        default: { $ref: '#/components/responses/Error' }
  /auth/mfa/enable:
    post:
      operationId: enableMfa
      x-access: mfa-incomplete
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Code' }
      responses:
        '204': { description: Two-step sign-in is on }
        default: { $ref: '#/components/responses/Error' }
  /auth/mfa/verify:
    post:
      operationId: verifyMfa
      x-access: mfa-incomplete
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Code' }
      responses:
        '204': { description: Two-step finished }
        default: { $ref: '#/components/responses/Error' }
  /auth/mfa/email-otp:
    post:
      operationId: sendEmailOtp
      x-access: mfa-incomplete
      responses:
        '202':
          description: Code emailed
          content:
            application/json:
              schema:
                type: object
                properties: { accepted: { type: boolean } }
        default: { $ref: '#/components/responses/Error' }
  /me:
    get:
      operationId: getMe
      x-access: mfa-incomplete
      responses:
        '200':
          description: The signed-in user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        default: { $ref: '#/components/responses/Error' }
  /users:
    get:
      operationId: listUsers
      x-access: users.manage
      responses:
        '200':
          description: Users in the caller's organisation
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
        default: { $ref: '#/components/responses/Error' }
  /users/{id}:
    get:
      operationId: getUser
      x-access: users.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: One user in the caller's organisation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        default: { $ref: '#/components/responses/Error' }
  /ops/auth/login:
    post:
      operationId: opsLogin
      x-access: public
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200':
          description: Signed in; two-step is always needed
          content:
            application/json:
              schema:
                type: object
                required: [mfaState]
                properties: { mfaState: { $ref: '#/components/schemas/MfaState' } }
        default: { $ref: '#/components/responses/Error' }
  /partners/register:
    post:
      operationId: registerPartner
      x-access: public
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '202':
          description: Accepted, whether or not the email is taken
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Accepted' }
        default: { $ref: '#/components/responses/Error' }
  /partner/agreement:
    get:
      operationId: getAgreement
      x-access: kyc.manage
      responses:
        '200':
          description: Current partner agreement
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: acceptAgreement
      x-access: kyc.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '204':
          description: Accepted
        default: { $ref: '#/components/responses/Error' }
  /kyc:
    get:
      operationId: getKyc
      x-access: kyc.manage
      responses:
        '200':
          description: KYC status and documents
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Kyc' }
        default: { $ref: '#/components/responses/Error' }
  /kyc/documents/{type}:
    post:
      operationId: uploadKycDocument
      x-access: kyc.manage
      parameters:
        - { name: type, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties: { file: { type: string, format: binary } }
      responses:
        '204':
          description: Stored
        default: { $ref: '#/components/responses/Error' }
  /kyc/documents/{id}/url:
    get:
      operationId: kycDocumentUrl
      x-access: kyc.manage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Short-lived link
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Link' }
        default: { $ref: '#/components/responses/Error' }
  /kyc/submit:
    post:
      operationId: submitKyc
      x-access: kyc.manage
      responses:
        '204':
          description: Sent for review
        default: { $ref: '#/components/responses/Error' }
  /files/{token}:
    get:
      operationId: readFile
      x-access: public
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The file
        default: { $ref: '#/components/responses/Error' }
  /ops/partners:
    get:
      operationId: opsListPartners
      x-access: partners.view
      parameters:
        - { name: kycStatus, in: query, schema: { type: string } }
      responses:
        '200':
          description: Partners
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/OpsPartner' }
        default: { $ref: '#/components/responses/Error' }
  /ops/partners/{id}:
    get:
      operationId: opsGetPartner
      x-access: partners.view
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: One partner with documents
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpsPartnerDetail' }
        default: { $ref: '#/components/responses/Error' }
  /ops/partners/{id}/kyc-decision:
    post:
      operationId: opsDecideKyc
      x-access: kyc.review
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '204':
          description: Decision saved
        default: { $ref: '#/components/responses/Error' }
  /ops/kyc/documents/{id}/url:
    get:
      operationId: opsKycDocumentUrl
      x-access: kyc.review
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Short-lived link
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Link' }
        default: { $ref: '#/components/responses/Error' }
  /ops/kyc/documents/{id}/review:
    post:
      operationId: opsReviewKycDocument
      x-access: kyc.review
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '204':
          description: Saved
        default: { $ref: '#/components/responses/Error' }
  /catalogue/products:
    get:
      operationId: listProducts
      x-access: case.create
      responses:
        '200':
          description: Products this partner can use
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { type: object, required: [code, name], properties: { code: { type: string }, name: { type: string } } }
        default: { $ref: '#/components/responses/Error' }
  /lenders:
    get:
      operationId: listLenders
      x-access: case.create
      parameters:
        - { name: product, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Lenders offering the product
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { type: object, required: [id, name], properties: { id: { type: string }, name: { type: string }, type: { type: string } } }
        default: { $ref: '#/components/responses/Error' }
  /cases/drafts:
    post:
      operationId: createDraft
      x-access: case.create
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      responses:
        '201':
          description: Draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Draft' }
        default: { $ref: '#/components/responses/Error' }
    get:
      operationId: listDrafts
      x-access: case.create
      responses:
        '200':
          description: Your open drafts
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { type: object, required: [id], properties: { id: { type: string }, product: { type: [string, 'null'] }, updatedAt: { type: string } } }
        default: { $ref: '#/components/responses/Error' }
  /cases/drafts/{id}:
    get:
      operationId: getDraft
      x-access: case.create
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Draft' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      operationId: patchDraft
      x-access: case.create
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Draft
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Draft' }
        default: { $ref: '#/components/responses/Error' }
  /cases/drafts/{id}/documents/{docType}:
    post:
      operationId: uploadCaseDocument
      x-access: case.create
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: docType, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties: { file: { type: string, format: binary } }
      responses:
        '204':
          description: Stored
        default: { $ref: '#/components/responses/Error' }
  /cases/drafts/{id}/consent-requests:
    post:
      operationId: requestConsent
      x-access: case.create
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '202':
          description: Sent
        default: { $ref: '#/components/responses/Error' }
  /cases/drafts/{id}/submit:
    post:
      operationId: submitDraft
      x-access: case.create
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '201':
          description: The new case
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseRef' }
        default: { $ref: '#/components/responses/Error' }
  /public/consent/{token}:
    get:
      operationId: getConsentPage
      x-access: public
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: What the customer is agreeing to
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: giveConsent
      x-access: public
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '204':
          description: Recorded
        default: { $ref: '#/components/responses/Error' }
